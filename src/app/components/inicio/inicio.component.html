<div class="banner6">
  <div class="container">
    <div class="col-lg-5 align-justify-center contact-form">
      <div class="col-md-9">
        <h2 class="mb-3 font-weight-light">Iniciar sesión</h2>
        <h6 class="subtitle font-weight-normal">Te damos la bienvenida</h6>
        <form class="mt-4" [formGroup]="loginForm" (ngSubmit)="login()">
          <div class="col-lg-12">
            <div class="form-group">
              <input class="form-control" type="email" placeholder="Correo electrónico" id="email"
                formControlName="email" required>
            </div>
          </div>
          <div class="mt-3 col-lg-12">
            <div class="form-group">
              <input class="form-control" type="password" placeholder="Contraseña" id="password"
                formControlName="password" required>
            </div>
          </div>
          <div class="d-grid mt-4 col-lg-16">
            <button type="submit" class="btn btn-lg btn-ingresar text-white border-0">Ingresar</button>
          </div>
        </form>
        <div class="row">
          <div class="col-lg-12 text-center mt-4">
            <div class="row">
              <div class="d-grid gap-2 col-8 mx-auto">
                <button type="submit" class="btn btn-primary btn-google" (click)="loginGoogle()">
                  <span class="google-icon"><img src="icon-google.png" alt="Google icon">Ingresa con
                    Google</span></button>
              </div>
            </div>
          </div>
          <div class="col-lg-12 text-center mt-4">
            ¿Aún no tienes cuenta? <a href="/registro" class="text-link">Registrate</a>
            <mat-divider></mat-divider>
            <button class="btn btn-lg btn-ingresar text-white border-0" data-bs-toggle="modal"
              data-bs-target="#resertPassword">
              ¿Olvidaste tu contraseña?</button>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div class="col-lg-6 right-image"
    style="background-image:url(https://images.pexels.com/photos/8383482/pexels-photo-8383482.jpeg?auto=compress&cs=tinysrgb&w=1260&h=750&dpr=1);">
  </div>
</div>

<!-- modals -->
<div class="modal fade" id="resertPassword" tabindex="-1" aria-labelledby="resertPasswordLabel" aria-hidden="true"
  #resertPasswordModal>
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h1 class="modal-title fs-5" id="resertPasswordLabel">Recupera tu contraseña</h1>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <form [formGroup]="resertPasswordForm" (ngSubmit)="resertPassword();">
          <div class="mb-3">
            <label class="form-label" for="correoElectronico">Correo Electr&oacute;nico</label>
            <input type="email" class="form-control" formControlName="correoElectronico" autocomplete="off"
              placeholder="ejemplo@gmail.com">
          </div>
          <div class="modal-footer">
            <button type="submit" class="btn btn-success">Enviar correo</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
